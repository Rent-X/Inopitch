<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentX - Delivery & Inspection Portal</title>
    <!-- Include EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        emailjs.init('asIDX-R2PgGvy-70I');
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #ffffff; }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h3 { margin-top: 0; color: #4CAF50; font-size: 18px; }
        .btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }
        .btn:hover { background-color: #27ae60; }
        .file-btn {
            background-color: #34495e;
            color: white;
            border: 1px solid #4f6f8f;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            display: block;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .no-tasks { color: #888; font-style: italic; }
        .preview-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 4px;
            margin-top: 8px;
            margin-bottom: 8px;
            display: none;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <h1>RentX - Delivery & Inspection Portal</h1>
    <p>Upload damage/inspection proofs to send directly to Manager email.</p>

    <h2 style="margin-top: 30px; font-size: 20px; border-bottom: 1px solid #333; padding-bottom: 8px;">Assigned Tasks</h2>
    <div id="tasks-container" class="container">
        <!-- Dynamic tasks will load here -->
    </div>

    <script>
        function loadTasks() {
            const container = document.getElementById('tasks-container');
            const tasks = JSON.parse(localStorage.getItem('rentx_manager_approvals')) || [];

            if (tasks.length === 0) {
                container.innerHTML = '<p class="no-tasks">No assigned delivery or inspection tasks right now.</p>';
                return;
            }

            container.innerHTML = '';
            tasks.forEach(task => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div style="background: #d35400; color: white; padding: 4px 8px; border-radius: 4px; display: inline-block; font-size: 11px; font-weight: bold; margin-bottom: 10px;">Customer Rental Delivery</div>
                    <h3 style="margin-bottom: 12px; font-size: 18px;">${task.name || task.item || 'Rental Item'}</h3>
                    <p><strong>Task ID:</strong> #${task.id}</p>
                    <p><strong>Owner:</strong> ${task.owner || 'N/A'}</p>
                    <p><strong>Address:</strong> ${task.address || 'N/A'}</p>
                    <p><strong>Rate:</strong> ₹${task.rate || 0} / day</p>
                    
                    <img id="img-preview-${task.id}" class="preview-img" alt="Inspection Preview">
                    
                    <label class="file-btn">
                        📷 Capture/Upload Inspection Photo
                        <input type="file" id="file-${task.id}" accept="image/*" style="display: none;" onchange="previewImage(this, '${task.id}')">
                    </label>
                    
                    <button class="btn" onclick="completeTask('${task.id}', '${task.name || task.item || 'Item'}')">Submit Proof & Complete Task</button>
                `;
                container.appendChild(card);
            });
        }

        function previewImage(input, taskId) {
            const preview = document.getElementById(`img-preview-${taskId}`);
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function completeTask(taskId, taskName) {
            const fileInput = document.getElementById(`file-${taskId}`);
            
            const finalizeCompletion = () => {
                let tasks = JSON.parse(localStorage.getItem('rentx_manager_approvals')) || [];
                tasks = tasks.filter(task => task.id !== taskId);
                localStorage.setItem('rentx_manager_approvals', JSON.stringify(tasks));
                
                alert("Task completed, email sent to manager, and task removed!");
                loadTasks();
            };

            if (fileInput && fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const base64Image = event.target.result;

                    const templateParams = {
                        task_id: taskId,
                        item_name: taskName,
                        proof_image_url: base64Image,
                        message: `Delivery proof submitted successfully for Task #${taskId} (${taskName}).`
                    };

                    emailjs.send('service_hbxvvz3', 'template_n35ydzr', templateParams)
                        .then(response => {
                            finalizeCompletion();
                        }, error => {
                            alert("Email failed to send, but removing task locally.");
                            finalizeCompletion();
                        });
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                const templateParams = {
                    task_id: taskId,
                    item_name: taskName,
                    proof_image_url: "No image attached",
                    message: `Delivery completed without photo for Task #${taskId} (${taskName}).`
                };

                emailjs.send('service_hbxvvz3', 'template_n35ydzr', templateParams)
                    .then(() => finalizeCompletion())
                    .catch(() => finalizeCompletion());
            }
        }

        window.onload = loadTasks;
    </script>
</body>
</html>
