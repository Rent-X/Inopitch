<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentX - Delivery & Inspection Portal</title>
    <!-- Include EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        // Initialize EmailJS with your Public Key
        emailjs.init('asIDX-R2PgGvy-70I');
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #ffffff; }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h3 { margin-top: 0; color: #4CAF50; }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }
        .btn:hover { background-color: #45a049; }
        .file-input { margin-bottom: 10px; color: #fff; }
        .no-tasks { color: #888; font-style: italic; }
    </style>
</head>
<body>

    <h1>RentX - Delivery & Inspection Portal</h1>
    <p>Upload damage/inspection proofs to send directly to Manager email.</p>

    <div id="tasks-container" class="container">
        <!-- Dynamic tasks will load here -->
    </div>

    <script>
        function loadTasks() {
            const container = document.getElementById('tasks-container');
            const tasks = JSON.parse(localStorage.getItem('rentx_manager_approvals')) || [];

            if (tasks.length === 0) {
                container.innerHTML = '<p class="no-tasks">No assigned delivery or inspection tasks right now.</p>';
                return;
            }

            container.innerHTML = '';
            tasks.forEach(task => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${task.name || task.item || 'Rental Item'}</h3>
                    <p><strong>Task ID:</strong> #${task.id}</p>
                    <p><strong>Owner:</strong> ${task.owner || 'N/A'}</p>
                    <p><strong>Address:</strong> ${task.address || 'N/A'}</p>
                    <p><strong>Rate:</strong> ₹${task.rate || 0} / day</p>
                    
                    <label style="font-size: 12px; color: #aaa;">Upload Inspection Photo:</label>
                    <input type="file" id="file-${task.id}" class="file-input" accept="image/*">
                    
                    <button class="btn" onclick="completeTask('${task.id}', '${task.name || task.item || 'Item'}')">Submit Proof & Complete Task</button>
                `;
                container.appendChild(card);
            });
        }

        function completeTask(taskId, taskName) {
            const fileInput = document.getElementById(`file-${taskId}`);
            
            // Helper function to process completion and cleanup localStorage
            const finalizeCompletion = () => {
                let tasks = JSON.parse(localStorage.getItem('rentx_manager_approvals')) || [];
                tasks = tasks.filter(task => task.id !== taskId);
                localStorage.setItem('rentx_manager_approvals', JSON.stringify(tasks));
                
                alert("Task completed, email sent to manager, and task removed!");
                loadTasks();
            };

            // Check if a photo was attached to convert and send via EmailJS
            if (fileInput && fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const base64Image = event.target.result; // Compressed/ converted image string

                    const templateParams = {
                        task_id: taskId,
                        item_name: taskName,
                        proof_image_url: base64Image, // Matches your EmailJS template variable
                        message: `Delivery proof submitted successfully for Task #${taskId} (${taskName}).`
                    };

                    // Send email via EmailJS
                    emailjs.send('service_hbxvvz3', 'template_n35ydzr', templateParams)
                        .then(response => {
                            console.log('SUCCESS!', response.status, response.text);
                            finalizeCompletion();
                        }, error => {
                            console.error('FAILED...', error);
                            alert("Email failed to send, but removing task locally.");
                            finalizeCompletion();
                        });
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                // If no image uploaded, just complete and remove task anyway
                const templateParams = {
                    task_id: taskId,
                    item_name: taskName,
                    proof_image_url: "No image attached",
                    message: `Delivery completed without photo for Task #${taskId} (${taskName}).`
                };

                emailjs.send('service_hbxvvz3', 'template_n35ydzr', templateParams)
                    .then(() => {
                        finalizeCompletion();
                    }).catch(() => {
                        finalizeCompletion();
                    });
            }
        }

        // Load tasks on page start
        window.onload = loadTasks;
    </script>
</body>
</html>
