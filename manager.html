<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentX Manager Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #ffffff; }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h3 { margin-top: 0; color: #2196F3; }
        .btn-approve {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }
        .btn-approve:hover { background-color: #0b7dda; }
        .no-tasks { color: #888; font-style: italic; }
    </style>
</head>
<body>

    <h1>RentX Manager Hub</h1>
    <p>Logged in as: nesar.minein@gmail.com</p>

    <h2>Pending Item Approvals</h2>
    <div id="manager-container" class="container">
        <!-- Dynamic manager approvals will load here -->
    </div>

    <script>
        function loadManagerApprovals() {
            const container = document.getElementById('manager-container');
            // Reads from the unified storage key where marketplace items get submitted
            const pendingItems = JSON.parse(localStorage.getItem('rentx_manager_approvals')) || [];

            if (pendingItems.length === 0) {
                container.innerHTML = '<p class="no-tasks">No pending items awaiting manager approval.</p>';
                return;
            }

            container.innerHTML = '';
            pendingItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${item.name || item.item || 'New Listing'}</h3>
                    <p><strong>ID:</strong> #${item.id}</p>
                    <p><strong>Owner:</strong> ${item.owner || 'N/A'}</p>
                    <p><strong>Address:</strong> ${item.address || 'N/A'}</p>
                    <p><strong>Rate:</strong> ₹${item.rate || 0} / day</p>
                    <button class="btn-approve" onclick="approveItem('${item.id}')">Approve & Publish Item</button>
                `;
                container.appendChild(card);
            });
        }

        function approveItem(itemId) {
            let items = JSON.parse(localStorage.getItem('rentx_manager_approvals')) || [];
            
            // Filter out the approved item from the local storage queue
            items = items.filter(item => item.id !== itemId);
            
            localStorage.setItem('rentx_manager_approvals', JSON.stringify(items));
            
            alert("Item approved successfully!");
            loadManagerApprovals(); // Refresh view instantly
        }

        // Load items on page start
        window.onload = loadManagerApprovals;
    </script>
</body>
</html>
