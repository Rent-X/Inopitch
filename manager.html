<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentX Manager Hub</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a; /* Slate Blue Theme */
            color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
        }
        .container-main { max-width: 1000px; margin: 0 auto; }
        h1 { color: #ffffff; font-size: 24px; margin-bottom: 5px; }
        .subtext { color: #94a3b8; font-size: 13px; margin-bottom: 30px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        .card h3 { margin-top: 0; color: #fff; font-size: 16px; margin-bottom: 10px; }
        .card p { font-size: 13px; color: #94a3b8; margin: 6px 0; }
        .badge {
            background: #0f172a;
            color: #3b82f6;
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 12px;
            border: 1px solid #334155;
        }
        .manager-img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 6px;
            margin: 10px 0;
            border: 1px solid #334155;
            background: #0f172a;
        }
        .btn-approve {
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            font-weight: 600;
            font-size: 13px;
        }
        .btn-approve:hover { background-color: #2563eb; }
        .no-tasks { color: #64748b; font-style: italic; font-size: 14px; }
        .nav-links { margin-top: 30px; font-size: 13px; }
        .nav-links a { color: #94a3b8; text-decoration: none; margin-right: 15px; }
        .nav-links a:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="container-main">
        <h1>RentX Manager Hub</h1>
        <div class="subtext">Logged in as: nesar.minein@gmail.com</div>

        <h2 style="font-size: 16px; color: #f8fafc; border-bottom: 1px solid #1e293b; padding-bottom: 10px;">Pending Approvals</h2>
        <div id="manager-container" class="grid" style="margin-top: 20px;"></div>

        <div class="nav-links">
            <a href="index.html">← Back to Marketplace</a>
        </div>
    </div>

    <script>
        function loadManagerApprovals() {
            const container = document.getElementById('manager-container');
            let pendingItems = JSON.parse(localStorage.getItem('rentx_manager_approvals')) || 
                               JSON.parse(localStorage.getItem('rentx_pending_tasks')) || [];

            if (pendingItems.length === 0) {
                container.innerHTML = '<p class="no-tasks">No pending items awaiting manager approval.</p>';
                return;
            }

            container.innerHTML = '';
            pendingItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                let imageHtml = item.image 
                    ? `<img src="${item.image}" class="manager-img" alt="Item">`
                    : `<div style="font-size: 12px; color: #64748b; margin: 10px 0; font-style: italic;">No image attached</div>`;

                card.innerHTML = `
                    <div class="badge">Verification Required</div>
                    <h3>${item.name || item.item}</h3>
                    <p><strong>ID:</strong> ${item.id}</p>
                    <p><strong>Owner:</strong> ${item.owner || 'N/A'}</p>
                    <p><strong>Address:</strong> ${item.address || 'N/A'}</p>
                    <p><strong>Rate:</strong> ₹${item.rate || 0} / day</p>
                    ${imageHtml}
                    <button class="btn-approve" onclick="approveItem('${item.id}')">Approve & Publish to Marketplace</button>
                `;
                container.appendChild(card);
            });
        }

        function approveItem(itemId) {
            let keyToUse = localStorage.getItem('rentx_manager_approvals') ? 'rentx_manager_approvals' : 'rentx_pending_tasks';
            let items = JSON.parse(localStorage.getItem(keyToUse)) || [];
            const approvedItem = items.find(i => i.id === itemId);
            
            items = items.filter(item => item.id !== itemId);
            localStorage.setItem(keyToUse, JSON.stringify(items));

            if (approvedItem) {
                let deliveryTasks = JSON.parse(localStorage.getItem('rentx_delivery_tasks')) || [];
                deliveryTasks.push(approvedItem);
                localStorage.setItem('rentx_delivery_tasks', JSON.stringify(deliveryTasks));

                let marketplaceItems = JSON.parse(localStorage.getItem('rentx_marketplace_items')) || [];
                marketplaceItems.push(approvedItem);
                localStorage.setItem('rentx_marketplace_items', JSON.stringify(marketplaceItems));
            }
            
            alert("Item approved, published to Marketplace, and sent to delivery!");
            loadManagerApprovals();
        }

        window.onload = loadManagerApprovals;
    </script>
</body>
</html>
