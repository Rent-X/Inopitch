<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentX Manager Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #ffffff; }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h3 { margin-top: 0; color: #3498db; font-size: 18px; }
        .btn-approve {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }
        .btn-approve:hover { background-color: #1f618d; }
        .no-tasks { color: #888; font-style: italic; }
        .manager-img-preview {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 4px;
            margin-top: 10px;
            margin-bottom: 10px;
            border: 1px solid #444;
            background-color: #111;
        }
    </style>
</head>
<body>

    <h1>RentX Manager Hub</h1>
    <p>Logged in as: nesar.minein@gmail.com</p>

    <h2 style="font-size: 20px; border-bottom: 1px solid #333; padding-bottom: 8px; margin-top: 30px;">Pending Item Approvals & Images</h2>
    <div id="manager-container" class="container">
        <!-- Dynamic manager approvals will load here -->
    </div>

    <script>
        function loadManagerApprovals() {
            const container = document.getElementById('manager-container');
            const pendingItems = JSON.parse(localStorage.getItem('rentx_manager_approvals')) || [];

            if (pendingItems.length === 0) {
                container.innerHTML = '<p class="no-tasks">No pending items awaiting manager approval.</p>';
                return;
            }

            container.innerHTML = '';
            pendingItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                // Check if an image or proof was stored with this item object
                let imageHtml = '';
                if (item.image || item.proof_image_url) {
                    imageHtml = `<img src="${item.image || item.proof_image_url}" class="manager-img-preview" alt="Item Image">`;
                } else {
                    imageHtml = `<div style="font-size: 12px; color: #775; margin: 10px 0; font-style: italic;">No image attached with submission</div>`;
                }

                card.innerHTML = `
                    <div style="background: #2980b9; color: white; padding: 4px 8px; border-radius: 4px; display: inline-block; font-size: 11px; font-weight: bold; margin-bottom: 10px;">Manager Verification</div>
                    <h3 style="margin-bottom: 12px;">${item.name || item.item || 'New Listing'}</h3>
                    <p><strong>ID:</strong> #${item.id}</p>
                    <p><strong>Owner:</strong> ${item.owner || 'N/A'}</p>
                    <p><strong>Address:</strong> ${item.address || 'N/A'}</p>
                    <p><strong>Rate:</strong> ₹${item.rate || 0} / day</p>
                    
                    ${imageHtml}

                    <button class="btn-approve" onclick="approveItem('${item.id}')">Approve & Publish Item</button>
                `;
                container.appendChild(card);
            });
        }

        function approveItem(itemId) {
            let items = JSON.parse(localStorage.getItem('rentx_manager_approvals')) || [];
            items = items.filter(item => item.id !== itemId);
            localStorage.setItem('rentx_manager_approvals', JSON.stringify(items));
            
            alert("Item approved successfully!");
            loadManagerApprovals();
        }

        window.onload = loadManagerApprovals;
    </script>
</body>
</html>
