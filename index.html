<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentX - Marketplace</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f59e0b;
            --success: #10b981;
            --brand: #3b82f6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 24px; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
        .nav-tabs { display: flex; gap: 12px; background: var(--bg-card); padding: 4px; border-radius: 8px; border: 1px solid var(--border); }
        .tab-btn { background: none; border: none; color: var(--text-muted); padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .tab-btn.active { background: var(--brand); color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; }
        .price { font-size: 18px; font-weight: bold; color: var(--accent); margin: 8px 0; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--text-muted); }
        .form-control { width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); font-size: 14px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; background: var(--brand); color: #fff; }
        .btn-success { background: var(--success); }
        .hidden { display: none; }
        .form-container { max-width: 600px; margin: 0 auto; background: var(--bg-card); border: 1px solid var(--border); padding: 24px; border-radius: 12px; }
        .alert-success { background: rgba(16, 185, 129, 0.2); color: var(--success); padding: 12px; border-radius: 8px; margin-top: 16px; text-align: center; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>RentX Marketplace</h1>
            <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">Rent High-Value Items or Earn From What You Own</p>
        </div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchPage('shop')">Shop All Items</button>
            <button class="tab-btn" onclick="switchPage('seller')">List Your Item (Seller)</button>
        </div>
    </header>

    <main id="page-shop">
        <h2 style="margin-bottom: 16px; font-size: 20px;">Available for Rent (Manager Approved)</h2>
        <div class="grid" id="shop-items"></div>
    </main>

    <main id="page-seller" class="hidden">
        <div class="form-container">
            <h2 style="margin-bottom: 8px; font-size: 20px;">List Your Item for Rent</h2>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Fill in details below for delivery partner pickup and manager approval.</p>
            
            <form id="seller-form" onsubmit="handleSellerSubmit(event)">
                <div class="form-group">
                    <label>Owner Full Name</label>
                    <input type="text" id="owner-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Pickup Address</label>
                    <input type="text" id="pickup-address" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Item Name & Model</label>
                    <input type="text" id="item-title" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Desired Rental Rate (₹/day)</label>
                    <input type="number" id="daily-rate" class="form-control" required>
                </div>
                <button type="submit" class="btn">Submit for Pickup & Approval</button>
            </form>
            <div id="success-alert" class="alert-success hidden">
                ✅ <strong>Task Created!</strong> Check <code>delivery.html</code> and <code>manager.html</code>.
            </div>
        </div>
    </main>

    <script>
        function switchPage(page) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (page === 'shop') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('page-shop').classList.remove('hidden');
                document.getElementById('page-seller').classList.add('hidden');
                loadApprovedShopItems();
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('page-shop').classList.add('hidden');
                document.getElementById('page-seller').classList.remove('hidden');
            }
        }

        function handleSellerSubmit(event) {
            event.preventDefault();
            const taskData = {
                id: 'RX-' + Math.floor(1000 + Math.random() * 9000),
                owner: document.getElementById('owner-name').value,
                address: document.getElementById('pickup-address').value,
                item: document.getElementById('item-title').value,
                rate: document.getElementById('daily-rate').value,
                status: 'pending_photos',
                image: ''
            };
            localStorage.setItem('rentx_active_task', JSON.stringify(taskData));
            document.getElementById('seller-form').reset();
            document.getElementById('success-alert').classList.remove('hidden');
        }

        function loadApprovedShopItems() {
            const shopContainer = document.getElementById('shop-items');
            shopContainer.innerHTML = '';
            const approvedItems = JSON.parse(localStorage.getItem('rentx_approved_items')) || [];

            if (approvedItems.length === 0) {
                shopContainer.innerHTML = '<p style="color:var(--text-muted);">No approved listings live yet.</p>';
                return;
            }

            approvedItems.forEach(item => {
                const displayImg = item.image ? item.image : 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=600&q=80';
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <img src="${displayImg}" alt="${item.item}">
                        <h3>${item.item}</h3>
                        <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">Listed by ${item.owner}</p>
                        <div class="price">₹${Number(item.rate).toLocaleString()} / day</div>
                    </div>
                    <button class="btn btn-success" onclick="alert('Booking request sent for ${item.item}!')">Rent Now</button>
                `;
                shopContainer.appendChild(card);
            });
        }

        window.addEventListener('storage', loadApprovedShopItems);
        window.addEventListener('DOMContentLoaded', loadApprovedShopItems);
    </script>
</body>
</html>
