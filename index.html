<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentX Marketplace</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a; /* Slate Blue Theme */
            color: #f8fafc;
            margin: 0;
            padding: 30px 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 { color: #ffffff; font-size: 24px; margin: 0; }
        .btn-toggle {
            background-color: #3b82f6; /* Vibrant Blue */
            color: #fff;
            border: none;
            padding: 9px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .btn-toggle:hover { background-color: #2563eb; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        .card h3 { margin-top: 0; color: #fff; font-size: 16px; margin-bottom: 10px; }
        .card p { font-size: 13px; color: #94a3b8; margin: 6px 0; }
        .item-img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 6px;
            margin: 10px 0;
            border: 1px solid #334155;
            background: #0f172a;
        }
        
        /* Modal Form for Listing */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            box-sizing: border-box;
            max-height: 90vh;
            overflow-y: auto;
        }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            margin-bottom: 15px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #f8fafc;
            font-size: 14px;
        }
        input:focus { outline: none; border-color: #3b82f6; }
        .file-label {
            background-color: #0f172a;
            border: 1px dashed #334155;
            text-align: center;
            cursor: pointer;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: block;
            color: #94a3b8;
            font-size: 13px;
        }
        .file-label:hover { border-color: #3b82f6; color: #fff; }
        .btn-submit {
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
        }
        .btn-submit:hover { background-color: #2563eb; }
        .no-items { color: #64748b; font-style: italic; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-flex">
            <h1>RentX Marketplace</h1>
            <button class="btn-toggle" onclick="toggleModal(true)">+ List an Item</button>
        </div>

        <h2 style="font-size: 16px; color: #f8fafc; margin-bottom: 15px;">Available Items for Rent</h2>
        <div id="marketplace-grid" class="grid"></div>
    </div>

    <!-- Modal for Listing Item -->
    <div id="listModal" class="modal">
        <div class="modal-content">
            <h2 style="color: #fff; font-size: 18px; margin-top: 0; margin-bottom: 20px;">Submit Item for Approval</h2>
            
            <label>Item Name</label>
            <input type="text" id="itemName" placeholder="e.g., Gaming PC / DSLR Camera">

            <label>Owner Name</label>
            <input type="text" id="ownerName" placeholder="Your full name">

            <label>Daily Rental Rate (₹)</label>
            <input type="number" id="itemRate" placeholder="500">

            <label>Pickup Address</label>
            <input type="text" id="itemAddress" placeholder="Full pickup location address">

            <img id="imagePreview" class="item-img" alt="Upload Preview" style="display: none;">
            
            <label class="file-label">
                📁 Upload Item Photo
                <input type="file" id="itemImage" accept="image/*" style="display: none;" onchange="previewFile(this)">
            </label>

            <button class="btn-submit" onclick="submitItem()">Submit to Manager</button>
            <button class="btn-toggle" style="width: 100%; margin-top: 10px; background: transparent; border: 1px solid #334155; color: #94a3b8;" onclick="toggleModal(false)">Cancel</button>
        </div>
    </div>

    <script>
        function toggleModal(show) {
            document.getElementById('listModal').style.display = show ? 'flex' : 'none';
        }

        function previewFile(input) {
            const preview = document.getElementById('imagePreview');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function submitItem() {
            const name = document.getElementById('itemName').value.trim();
            const owner = document.getElementById('ownerName').value.trim();
            const rate = document.getElementById('itemRate').value.trim();
            const address = document.getElementById('itemAddress').value.trim();
            const fileInput = document.getElementById('itemImage');

            if (!name || !owner || !rate || !address) {
                alert("Please fill out all fields before submitting.");
                return;
            }

            // Async promise to ensure photo base64 is fully captured before storing
            let imageData = "";
            if (fileInput.files && fileInput.files[0]) {
                imageData = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(fileInput.files[0]);
                });
            }

            const newItem = {
                id: 'RENT-' + Math.floor(100000 + Math.random() * 900000),
                name: name,
                owner: owner,
                rate: rate,
                address: address,
                image: imageData
            };

            let approvals = JSON.parse(localStorage.getItem('rentx_manager_approvals')) || [];
            approvals.push(newItem);
            localStorage.setItem('rentx_manager_approvals', JSON.stringify(approvals));

            alert("Item successfully submitted with photo to Manager for approval!");
            toggleModal(false);
            
            // Clear form fields
            document.getElementById('itemName').value = '';
            document.getElementById('ownerName').value = '';
            document.getElementById('itemRate').value = '';
            document.getElementById('itemAddress').value = '';
            document.getElementById('itemImage').value = '';
            document.getElementById('imagePreview').style.display = 'none';
        }

        function loadMarketplaceItems() {
            const container = document.getElementById('marketplace-grid');
            const items = JSON.parse(localStorage.getItem('rentx_marketplace_items')) || [];

            if (items.length === 0) {
                container.innerHTML = '<p class="no-items">No items currently available for rent.</p>';
                return;
            }

            container.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                let imageHtml = item.image 
                    ? `<img src="${item.image}" class="item-img" alt="Item">`
                    : `<div style="font-size: 12px; color: #64748b; margin: 10px 0; font-style: italic;">No image available</div>`;

                card.innerHTML = `
                    <h3>${item.name}</h3>
                    <p><strong>Owner:</strong> ${item.owner}</p>
                    <p><strong>Address:</strong> ${item.address}</p>
                    <p><strong>Rate:</strong> ₹${item.rate} / day</p>
                    ${imageHtml}
                    <button class="btn-submit" style="margin-top: 10px; padding: 8px; font-size: 12px;" onclick="alert('Rental request initiated for ${item.name}!')">Rent Item</button>
                `;
                container.appendChild(card);
            });
        }

        window.onload = loadMarketplaceItems;
    </script>
</body>
</html>
