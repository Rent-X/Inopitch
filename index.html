<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentX Marketplace</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0b0b;
            color: #d1d1d1;
            margin: 0;
            padding: 30px 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 { color: #ffffff; font-size: 24px; margin: 0; }
        .nav-links a {
            color: #888;
            text-decoration: none;
            font-size: 13px;
            margin-left: 15px;
            font-weight: 500;
        }
        .nav-links a:hover { color: #fff; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 25px; }
        .tab-btn {
            background-color: #141414;
            color: #888;
            border: 1px solid #222;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .tab-btn.active { background-color: #ffffff; color: #0b0b0b; border-color: #ffffff; }

        .section-content { display: none; }
        .section-content.active { display: block; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: #141414;
            border: 1px solid #222;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        .card h3 { margin-top: 0; color: #fff; font-size: 16px; margin-bottom: 10px; }
        .card p { font-size: 13px; color: #999; margin: 6px 0; }
        .item-img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 6px;
            margin: 10px 0;
            border: 1px solid #2c2c2c;
            background: #0f0f0f;
        }
        .form-card {
            background-color: #141414;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        label { display: block; font-size: 13px; color: #888; margin-bottom: 6px; font-weight: 500; }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            margin-bottom: 20px;
            background-color: #1a1a1a;
            border: 1px solid #2c2c2c;
            border-radius: 6px;
            color: #e5e5e5;
            font-size: 14px;
        }
        input:focus { outline: none; border-color: #555; background-color: #1f1f1f; }
        .file-label {
            background-color: #1a1a1a;
            border: 1px dashed #333;
            text-align: center;
            cursor: pointer;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: block;
            color: #888;
            font-size: 13px;
        }
        .file-label:hover { border-color: #555; color: #fff; }
        .btn-submit {
            background-color: #ffffff;
            color: #0b0b0b;
            border: none;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
        }
        .btn-submit:hover { background-color: #dcdcdc; }
        .no-items { color: #666; font-style: italic; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-flex">
            <h1>RentX Marketplace</h1>
            <div class="nav-links">
                <a href="manager.html">Manager Hub</a>
                <a href="delivery.html">Delivery Portal</a>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('browse', this)">Browse Shop</button>
            <button class="tab-btn" onclick="switchTab('list', this)">List an Item</button>
        </div>

        <!-- Browse Marketplace Section -->
        <div id="browse-section" class="section-content active">
            <h2 style="font-size: 16px; color: #fff; margin-bottom: 15px;">Available Items for Rent</h2>
            <div id="marketplace-grid" class="grid"></div>
        </div>

        <!-- List Item Form Section -->
        <div id="list-section" class="section-content">
            <div class="form-card">
                <h2 style="color: #fff; font-size: 18px; margin-top: 0; margin-bottom: 20px;">Submit Item for Manager Approval</h2>
                
                <label>Item Name</label>
                <input type="text" id="itemName" placeholder="e.g., Gaming PC / DSLR Camera">

                <label>Owner Name</label>
                <input type="text" id="ownerName" placeholder="Your full name">

                <label>Daily Rental Rate (₹)</label>
                <input type="number" id="itemRate" placeholder="500">

                <label>Pickup Address</label>
                <input type="text" id="itemAddress" placeholder="Full pickup location address">

                <img id="imagePreview" class="item-img" alt="Upload Preview" style="display: none;">
                
                <label class="file-label">
                    📁 Upload Item Photo
                    <input type="file" id="itemImage" accept="image/*" style="display: none;" onchange="previewFile(this)">
                </label>

                <button class="btn-submit" onclick="submitItem()">Submit to Manager</button>
            </div>
        </div>
    </div>

    <script>
        let base64Image = "";

        function switchTab(tabName, btn) {
            document.querySelectorAll('.section-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabName + '-section').classList.add('active');
            btn.classList.add('active');

            if (tabName === 'browse') {
                loadMarketplaceItems();
            }
        }

        function previewFile(input) {
            const preview = document.getElementById('imagePreview');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64Image = e.target.result;
                    preview.src = base64Image;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function submitItem() {
            const name = document.getElementById('itemName').value.trim();
            const owner = document.getElementById('ownerName').value.trim();
            const rate = document.getElementById('itemRate').value.trim();
            const address = document.getElementById('itemAddress').value.trim();

            if (!name || !owner || !rate || !address) {
                alert("Please fill out all fields before submitting.");
                return;
            }

            const newItem = {
                id: 'RENT-' + Math.floor(100000 + Math.random() * 900000),
                name: name,
                owner: owner,
                rate: rate,
                address: address,
                image: base64Image
            };

            let approvals = JSON.parse(localStorage.getItem('rentx_manager_approvals')) || [];
            approvals.push(newItem);
            localStorage.setItem('rentx_manager_approvals', JSON.stringify(approvals));

            alert("Item successfully submitted to Manager for approval!");
            
            // Reset form and switch back to browse
            document.getElementById('itemName').value = '';
            document.getElementById('ownerName').value = '';
            document.getElementById('itemRate').value = '';
            document.getElementById('itemAddress').value = '';
            document.getElementById('imagePreview').style.display = 'none';
            base64Image = "";

            document.querySelectorAll('.tab-btn')[0].click();
        }

        function loadMarketplaceItems() {
            const container = document.getElementById('marketplace-grid');
            const items = JSON.parse(localStorage.getItem('rentx_marketplace_items')) || [];

            if (items.length === 0) {
                container.innerHTML = '<p class="no-items">No items currently available for rent.</p>';
                return;
            }

            container.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                let imageHtml = item.image 
                    ? `<img src="${item.image}" class="item-img" alt="Item">`
                    : `<div style="font-size: 12px; color: #555; margin: 10px 0; font-style: italic;">No image available</div>`;

                card.innerHTML = `
                    <h3>${item.name}</h3>
                    <p><strong>Owner:</strong> ${item.owner}</p>
                    <p><strong>Address:</strong> ${item.address}</p>
                    <p><strong>Rate:</strong> ₹${item.rate} / day</p>
                    ${imageHtml}
                    <button class="btn-submit" style="margin-top: 10px; padding: 8px;" onclick="alert('Rental request initiated for ${item.name}!')">Rent Item</button>
                `;
                container.appendChild(card);
            });
        }

        window.onload = loadMarketplaceItems;
    </script>
</body>
</html>
