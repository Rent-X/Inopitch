<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentX Marketplace</title>
    <style>
        :root {
    --bg-main: #090d16;
    --bg-card: rgba(30, 41, 59, 0.65);
    --border-color: rgba(51, 65, 85, 0.6);
    --accent-blue: #3b82f6;
    --accent-hover: #2563eb;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-main);
    color: var(--text-main);
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
}

/* Unified Navigation Bar */
.navbar {
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 1000;
    padding: 16px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.navbar .brand {
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.5px;
    color: #fff;
    text-decoration: none;
}

.navbar-links {
    display: flex;
    gap: 20px;
    font-size: 13px;
    font-weight: 500;
}

.navbar-links a {
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.2s ease;
}

.navbar-links a:hover, .navbar-links a.active {
    color: var(--text-main);
}

.main-container {
    max-width: 1100px;
    margin: 40px auto;
    padding: 0 20px;
}

/* Glassmorphism Cards */
.card {
    background: var(--bg-card);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    transition: transform 0.2s ease, border-color 0.2s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.card:hover {
    transform: translateY(-3px);
    border-color: rgba(59, 130, 246, 0.4);
}

/* Modern Pill Badges */
.badge {
    background: rgba(59, 130, 246, 0.1);
    color: #60a5fa;
    padding: 4px 10px;
    border-radius: 20px;
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid rgba(59, 130, 246, 0.2);
    margin-bottom: 14px;
}

/* Sleek Buttons */
.btn-primary {
    background-color: var(--accent-blue);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: background-color 0.2s ease, box-shadow 0.2s ease;
}

.btn-primary:hover {
    background-color: var(--accent-hover);
    box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
}
    </style>
</head>
<body>

    <div class="container">
        <div class="header-flex">
            <h1>RentX Marketplace</h1>
            <button class="btn-primary" onclick="openModal('listModal')">+ List an Item</button>
        </div>

        <h2 style="font-size: 16px; color: #f8fafc; margin-bottom: 15px;">Available Items for Rent</h2>
        <div id="marketplace-grid" class="grid"></div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Action successful!</div>

    <!-- Modal: List Item (No image required from customer) -->
    <div id="listModal" class="modal">
        <div class="modal-content">
            <h2 style="color: #fff; font-size: 18px; margin-top: 0; margin-bottom: 20px;">List Item for Rent</h2>
            
            <label>Item Name</label>
            <input type="text" id="itemName" placeholder="e.g., Gaming PC / DSLR Camera">

            <label>Owner Name</label>
            <input type="text" id="ownerName" placeholder="Your full name">

            <label>Daily Rental Rate (₹)</label>
            <input type="number" id="itemRate" placeholder="500">

            <label>Pickup Address</label>
            <input type="text" id="itemAddress" placeholder="Full pickup location address">

            <p style="font-size: 11px; color: #64748b; margin-bottom: 15px; font-style: italic;">Note: A delivery partner will visit your location to inspect the item and take a verified photo.</p>

            <button class="btn-primary" style="width: 100%;" onclick="submitItem()">Send to Delivery Partner</button>
            <button class="btn-secondary" onclick="closeModal('listModal')">Cancel</button>
        </div>
    </div>

    <!-- Modal: Rent Item Checkout -->
    <div id="rentModal" class="modal">
        <div class="modal-content">
            <h2 style="color: #fff; font-size: 18px; margin-top: 0; margin-bottom: 5px;" id="rentModalTitle">Rent Item</h2>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;" id="rentModalRate"></p>
            
            <label>Your Full Name (Renter)</label>
            <input type="text" id="renterName" placeholder="Enter your name">

            <label>Delivery Address</label>
            <input type="text" id="renterAddress" placeholder="Where should we deliver this?">

            <label>Contact Phone Number</label>
            <input type="text" id="renterPhone" placeholder="10-digit mobile number">

            <button class="btn-primary" style="width: 100%;" onclick="confirmRental()">Confirm & Dispatch Order</button>
            <button class="btn-secondary" onclick="closeModal('rentModal')">Cancel</button>
        </div>
    </div>

    <script>
        let selectedItemForRent = null;

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function openModal(modalId) { document.getElementById(modalId).style.display = 'flex'; }
        function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }

        function submitItem() {
            const name = document.getElementById('itemName').value.trim();
            const owner = document.getElementById('ownerName').value.trim();
            const rate = document.getElementById('itemRate').value.trim();
            const address = document.getElementById('itemAddress').value.trim();

            if (!name || !owner || !rate || !address) {
                showToast("Please fill out all fields.");
                return;
            }

            const newItem = {
                id: 'LIST-' + Math.floor(100000 + Math.random() * 900000),
                name: name,
                owner: owner,
                rate: rate,
                address: address,
                image: "" // Empty initially, filled by delivery partner
            };

            let deliveryTasks = JSON.parse(localStorage.getItem('rentx_delivery_tasks')) || [];
            deliveryTasks.push(newItem);
            localStorage.setItem('rentx_delivery_tasks', JSON.stringify(deliveryTasks));

            showToast("Item sent to Delivery Partner for pickup & photo verification!");
            closeModal('listModal');
            
            document.getElementById('itemName').value = '';
            document.getElementById('ownerName').value = '';
            document.getElementById('itemRate').value = '';
            document.getElementById('itemAddress').value = '';
        }

        function openRentModal(itemJson) {
            selectedItemForRent = JSON.parse(decodeURIComponent(itemJson));
            document.getElementById('rentModalTitle').textContent = `Rent: ${selectedItemForRent.name}`;
            document.getElementById('rentModalRate').textContent = `Rate: ₹${selectedItemForRent.rate} / day`;
            openModal('rentModal');
        }

        function confirmRental() {
            const renterName = document.getElementById('renterName').value.trim();
            const renterAddress = document.getElementById('renterAddress').value.trim();
            const renterPhone = document.getElementById('renterPhone').value.trim();

            if (!renterName || !renterAddress || !renterPhone) {
                showToast("Please fill in your delivery details.");
                return;
            }

            const rentalOrder = {
                id: 'ORD-' + Math.floor(100000 + Math.random() * 900000),
                name: `Rental: ${selectedItemForRent.name}`,
                owner: selectedItemForRent.owner,
                address: `Deliver to: ${renterAddress} (Renter: ${renterName}, Ph: ${renterPhone})`,
                rate: selectedItemForRent.rate,
                image: selectedItemForRent.image
            };

            let deliveryTasks = JSON.parse(localStorage.getItem('rentx_delivery_tasks')) || [];
            deliveryTasks.push(rentalOrder);
            localStorage.setItem('rentx_delivery_tasks', JSON.stringify(deliveryTasks));

            showToast("Rental order placed & sent to Delivery Portal!");
            closeModal('rentModal');

            document.getElementById('renterName').value = '';
            document.getElementById('renterAddress').value = '';
            document.getElementById('renterPhone').value = '';
        }

        function loadMarketplaceItems() {
            const container = document.getElementById('marketplace-grid');
            const items = JSON.parse(localStorage.getItem('rentx_marketplace_items')) || [];

            if (items.length === 0) {
                container.innerHTML = '<p class="no-items">No items currently available for rent.</p>';
                return;
            }

            container.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                let imageHtml = item.image 
                    ? `<img src="${item.image}" class="item-img" alt="Item">`
                    : `<div style="font-size: 12px; color: #64748b; margin: 10px 0; font-style: italic;">No image available</div>`;

                const encodedItem = encodeURIComponent(JSON.stringify(item));

                card.innerHTML = `
                    <div>
                        <h3>${item.name}</h3>
                        <p><strong>Owner:</strong> ${item.owner}</p>
                        <p><strong>Pickup Location:</strong> ${item.address}</p>
                        <p><strong>Rate:</strong> ₹${item.rate} / day</p>
                        ${imageHtml}
                    </div>
                    <button class="btn-primary" style="margin-top: 15px; width: 100%;" onclick="openRentModal('${encodedItem}')">Rent This Item</button>
                `;
                container.appendChild(card);
            });
        }

        window.onload = loadMarketplaceItems;
    </script>
</body>
</html>
