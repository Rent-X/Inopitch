<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentX - Peer-to-Peer Rental Marketplace</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 24px; }
        nav { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
        .nav-btns button { background: none; border: 1px solid var(--border); color: var(--text-main); padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-left: 8px; font-weight: 600; }
        .nav-btns button.active { background: var(--accent); color: #000; border-color: var(--accent); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; }
        .price { font-size: 18px; font-weight: bold; color: var(--accent); margin: 8px 0; }
        .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; background: var(--success); color: #fff; margin-top: 12px; }
        
        /* Centering the Seller Form Container */
        .form-container { display: flex; flex-direction: column; align-items: center; width: 100%; }
        .form-box { width: 100%; max-width: 500px; background: var(--bg-card); padding: 24px; border-radius: 12px; border: 1px solid var(--border); }
        .form-group { margin-bottom: 16px; width: 100%; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--text-muted); }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 6px; color: var(--text-main); }
        .hidden { display: none !important; }
        
        /* Modal */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; }
        .modal-content { background: var(--bg-card); padding: 24px; border-radius: 12px; width: 90%; max-width: 400px; border: 1px solid var(--border); }
    </style>
</head>
<body>

    <nav>
        <h2>RentX Marketplace</h2>
        <div class="nav-btns">
            <button id="btn-shop" class="active" onclick="switchTab('shop')">Browse Shop</button>
            <button id="btn-sell" onclick="switchTab('sell')">List an Item</button>
        </div>
    </nav>

    <!-- SHOP VIEW -->
    <main id="view-shop">
        <h3 style="margin-bottom: 16px; font-size: 20px;">Available Items for Rent</h3>
        <div class="grid" id="shop-container"></div>
    </main>

    <!-- SELLER VIEW (Centered Layout) -->
    <main id="view-sell" class="hidden">
        <div class="form-container">
            <h3 style="margin-bottom: 16px; font-size: 20px; text-align: center;">Submit Item for Manager Approval</h3>
            <form id="seller-form" onsubmit="handleSellerSubmit(event)" class="form-box">
                <div class="form-group">
                    <label>Item Name</label>
                    <input type="text" id="item-name" required placeholder="e.g. DSLR Camera">
                </div>
                <div class="form-group">
                    <label>Owner Name</label>
                    <input type="text" id="owner-name" required placeholder="Your full name">
                </div>
                <div class="form-group">
                    <label>Daily Rental Rate (₹)</label>
                    <input type="number" id="item-rate" required placeholder="500">
                </div>
                <div class="form-group">
                    <label>Pickup Address</label>
                    <textarea id="pickup-address" required rows="3" placeholder="Full pickup location address"></textarea>
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" id="item-image" required placeholder="https://images.unsplash.com/...">
                </div>
                <button type="submit" class="btn">Submit for Manager Approval</button>
            </form>
        </div>
    </main>

    <!-- RENTAL CHECKOUT MODAL -->
    <div id="rental-modal" class="modal hidden">
        <div class="modal-content">
            <h3 style="margin-bottom: 12px;" id="modal-item-title">Rent Item</h3>
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" id="cust-name" placeholder="Enter full name">
            </div>
            <div class="form-group">
                <label>Delivery Address</label>
                <textarea id="cust-address" rows="2" placeholder="Enter delivery address"></textarea>
            </div>
            <div class="form-group">
                <label>Rental Duration (Days)</label>
                <input type="number" id="cust-days" value="1" min="1" onchange="calculateTotal()">
            </div>
            <div style="font-size: 16px; margin-bottom: 16px;">
                Total Amount: <strong id="modal-total" style="color: var(--accent);">₹0</strong>
            </div>
            <button class="btn" onclick="confirmRental()">Confirm Booking</button>
            <button class="btn" onclick="closeModal()" style="background: transparent; border: 1px solid var(--border); margin-top: 8px;">Cancel</button>
        </div>
    </div>

    <script>
        let currentRentingItem = null;

        function switchTab(tab) {
            if (tab === 'shop') {
                document.getElementById('view-shop').classList.remove('hidden');
                document.getElementById('view-sell').classList.add('hidden');
                document.getElementById('btn-shop').classList.add('active');
                document.getElementById('btn-sell').classList.remove('active');
                loadShopItems();
            } else {
                document.getElementById('view-shop').classList.add('hidden');
                document.getElementById('view-sell').classList.remove('hidden');
                document.getElementById('btn-sell').classList.add('active');
                document.getElementById('btn-shop').classList.remove('active');
            }
        }

async function loadShopItems() {
    const container = document.getElementById('shop-container');
    container.innerHTML = '';

    let items = [];
    const approvedLocally = JSON.parse(localStorage.getItem('rentx_approved_items')) || [];

    try {
        const response = await fetch('items.json');
        if (response.ok) {
            const jsonItems = await response.json();
            items = [...approvedLocally, ...jsonItems];
        } else {
            items = approvedLocally;
        }
    } catch (err) {
        items = approvedLocally;
    }

    // Filter out completely empty items
    items = items.filter(item => item && (item.name || item.title || item.item));

    if (items.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted);">No items currently available for rent.</p>';
        return;
    }

    items.forEach(item => {
        // Fallbacks check multiple possible property names from your JSON or form
        const itemName = item.name || item.title || item.item || 'Featured Rental Item';
        const itemRate = item.rate || item.price || 100;
        const itemImage = item.image || item.img || 'https://images.unsplash.com/photo-1526738549149-8e07eca6c147?auto=format&fit=crop&w=500&q=80';
        const itemId = item.id || Math.random().toString(36).substr(2, 9);

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div>
                <img src="${itemImage}" alt="${itemName}">
                <h3>${itemName}</h3>
                <div class="price">₹${itemRate} / day</div>
            </div>
            <button class="btn" onclick="openRentalModal('${itemId}', '${itemName}', ${itemRate})">Rent Now</button>
        `;
        container.appendChild(card);
    });
}

            if (items.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted);">No items currently available for rent.</p>';
                return;
            }

            items.forEach(item => {
                // Fallbacks prevent "undefined" text if json keys differ
                const itemName = item.name || item.title || 'Unnamed Item';
                const itemRate = item.rate || item.price || 0;
                const itemImage = item.image || item.img || 'https://via.placeholder.com/300';
                const itemId = item.id || Math.random().toString(36).substr(2, 9);

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <img src="${itemImage}" alt="${itemName}">
                        <h3>${itemName}</h3>
                        <div class="price">₹${itemRate} / day</div>
                    </div>
                    <button class="btn" onclick="openRentalModal('${itemId}', '${itemName}', ${itemRate})">Rent Now</button>
                `;
                container.appendChild(card);
            });
        }

        function handleSellerSubmit(e) {
            e.preventDefault();

            const newItem = {
                id: 'SEL-' + Math.floor(1000 + Math.random() * 9000),
                name: document.getElementById('item-name').value,
                owner: document.getElementById('owner-name').value,
                rate: parseFloat(document.getElementById('item-rate').value),
                address: document.getElementById('pickup-address').value,
                image: document.getElementById('item-image').value,
                submittedAt: new Date().toISOString()
            };

            const managerApprovals = JSON.parse(localStorage.getItem('rentx_manager_approvals')) || [];
            managerApprovals.push(newItem);
            localStorage.setItem('rentx_manager_approvals', JSON.stringify(managerApprovals));

            alert(`Item "${newItem.name}" submitted successfully! Sent to Manager for approval.`);
            document.getElementById('seller-form').reset();
            switchTab('shop');
        }

        function openRentalModal(id, name, rate) {
            currentRentingItem = { id, name, rate };
            document.getElementById('modal-item-title').innerText = `Rent ${name}`;
            document.getElementById('cust-name').value = '';
            document.getElementById('cust-address').value = '';
            document.getElementById('cust-days').value = 1;
            calculateTotal();
            document.getElementById('rental-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('rental-modal').classList.add('hidden');
            currentRentingItem = null;
        }

        function calculateTotal() {
            if (!currentRentingItem) return;
            const days = parseInt(document.getElementById('cust-days').value) || 1;
            const total = days * currentRentingItem.rate;
            document.getElementById('modal-total').innerText = `₹${total}`;
        }

        function confirmRental() {
            const customerName = document.getElementById('cust-name').value.trim();
            const deliveryAddress = document.getElementById('cust-address').value.trim();
            const days = parseInt(document.getElementById('cust-days').value) || 1;

            if (!customerName || !deliveryAddress) {
                alert('Please enter your name and delivery address.');
                return;
            }

            const deliveryTask = {
                id: 'DEL-' + Math.floor(1000 + Math.random() * 9000),
                type: 'delivery',
                item: currentRentingItem.name,
                customer: customerName,
                deliveryAddress: deliveryAddress,
                days: days,
                total: days * currentRentingItem.rate
            };

            const pendingDeliveries = JSON.parse(localStorage.getItem('rentx_delivery_tasks')) || [];
            pendingDeliveries.push(deliveryTask);
            localStorage.setItem('rentx_delivery_tasks', JSON.stringify(pendingDeliveries));

            alert(`Rental confirmed for ${currentRentingItem.name}! Delivery order #${deliveryTask.id} created.`);
            closeModal();
        }

        window.addEventListener('DOMContentLoaded', loadShopItems);
    </script>
</body>
</html>
