<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentX - List an Item</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0b0b;
            color: #d1d1d1;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .wrapper {
            width: 100%;
            max-width: 500px;
        }
        .card {
            background-color: #141414;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        h1 { color: #ffffff; font-size: 22px; margin-top: 0; margin-bottom: 20px; font-weight: 600; }
        label { display: block; font-size: 13px; color: #888; margin-bottom: 6px; font-weight: 500; }
        input, button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            margin-bottom: 20px;
            background-color: #1a1a1a;
            border: 1px solid #2c2c2c;
            border-radius: 6px;
            color: #e5e5e5;
            font-size: 14px;
        }
        input:focus { outline: none; border-color: #555; background-color: #1f1f1f; }
        .file-label {
            background-color: #1a1a1a;
            border: 1px dashed #333;
            text-align: center;
            cursor: pointer;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: block;
            color: #888;
            font-size: 13px;
        }
        .file-label:hover { border-color: #555; color: #fff; }
        .preview-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid #2c2c2c;
        }
        .btn-submit {
            background-color: #ffffff;
            color: #0b0b0b;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover { background-color: #dcdcdc; }
        .nav-links { text-align: center; margin-top: 15px; }
        .nav-links a { color: #888; text-decoration: none; font-size: 13px; margin: 0 10px; }
        .nav-links a:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="card">
            <h1>Submit Item for Manager Approval</h1>
            
            <label>Item Name</label>
            <input type="text" id="itemName" placeholder="e.g., Gaming PC / DSLR Camera">

            <label>Owner Name</label>
            <input type="text" id="ownerName" placeholder="Your full name">

            <label>Daily Rental Rate (₹)</label>
            <input type="number" id="itemRate" placeholder="500">

            <label>Pickup Address</label>
            <input type="text" id="itemAddress" placeholder="Full pickup location address">

            <img id="imagePreview" class="preview-img" alt="Upload Preview">
            
            <label class="file-label">
                📁 Upload Item Photo
                <input type="file" id="itemImage" accept="image/*" style="display: none;" onchange="previewFile(this)">
            </label>

            <button class="btn-submit" onclick="submitItem()">Submit to Manager</button>
        </div>

        <div class="nav-links">
            <a href="manager.html">Manager Hub</a> | 
            <a href="delivery.html">Delivery Portal</a>
        </div>
    </div>

    <script>
        let base64Image = "";

        function previewFile(input) {
            const preview = document.getElementById('imagePreview');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64Image = e.target.result;
                    preview.src = base64Image;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function submitItem() {
            const name = document.getElementById('itemName').value.trim();
            const owner = document.getElementById('ownerName').value.trim();
            const rate = document.getElementById('itemRate').value.trim();
            const address = document.getElementById('itemAddress').value.trim();

            if (!name || !owner || !rate || !address) {
                alert("Please fill out all fields before submitting.");
                return;
            }

            const newItem = {
                id: 'RENT-' + Math.floor(100000 + Math.random() * 900000),
                name: name,
                owner: owner,
                rate: rate,
                address: address,
                image: base64Image
            };

            let approvals = JSON.parse(localStorage.getItem('rentx_manager_approvals')) || [];
            approvals.push(newItem);
            localStorage.setItem('rentx_manager_approvals', JSON.stringify(approvals));

            alert("Item successfully submitted to Manager for approval!");
            window.location.href = 'manager.html';
        }
    </script>
</body>
</html>
